<html lang="en">
<head>

<title>Over-Rate Running Sheet</title>
<style>
:root{

}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){
  --bg:#0f1512; --card:#18201c; --ink:#e8eee9; --mute:#9aa8a0; --line:#2c3832; --line2:#222c27;
  --acc:#3fbf85; --acc-ink:#07140d; --acc-soft:#1d3a2c;
  --pos:#5fd68f; --neg:#ff8a80; --warn:#f0b35a; --warn-soft:#3b2d12; --neg-soft:#3d1f1c; --pos-soft:#18331f;
  --cur:#3a3410; --input:#101713; --shadow:none;}
}
:root[data-theme=dark]{
  --bg:#0f1512; --card:#18201c; --ink:#e8eee9; --mute:#9aa8a0; --line:#2c3832; --line2:#222c27;
  --acc:#3fbf85; --acc-ink:#07140d; --acc-soft:#1d3a2c;
  --pos:#5fd68f; --neg:#ff8a80; --warn:#f0b35a; --warn-soft:#3b2d12; --neg-soft:#3d1f1c; --pos-soft:#18331f;
  --cur:#3a3410; --input:#101713; --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;padding-bottom:60px}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:30;background:var(--acc);color:var(--acc-ink);display:flex;align-items:center;gap:12px;padding:8px max(16px,env(safe-area-inset-left));flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto}
.brand b{font-size:16px;letter-spacing:.02em}
.brand span{font-size:12px;opacity:.85}
.tools{display:flex;gap:8px;align-items:center}
.tools #saved{font-size:11px;opacity:.8}
.top button{background:rgba(255,255,255,.16);color:inherit;border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px;cursor:pointer}
.top button:hover{background:rgba(255,255,255,.28)}
#tabs{display:flex;gap:2px;overflow-x:auto;background:var(--card);border-bottom:1px solid var(--line);padding:0 12px;position:sticky;top:var(--tophh,51px);z-index:25}
.stickybar{position:sticky;top:var(--stick,100px);z-index:20;padding:8px!important;margin-bottom:10px;box-shadow:0 4px 10px rgba(0,0,0,.12)}

.live .stat{min-width:64px}
.live .ra{gap:8px 12px}
.live .big{padding:12px 16px!important}
.big2.drink{background:#8a5a00}
.status{padding:6px 14px;border-radius:10px;min-width:170px;border:2px solid currentColor}
.status b{font-size:22px;display:block;line-height:1.15}
.status small{font-size:12px;opacity:.9}
.status.ahead{background:var(--pos-soft);color:var(--pos)}
.status.behind{background:var(--neg-soft);color:var(--neg)}
.status.ontime{background:var(--card);color:var(--ink)}
.alw{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto;padding-left:14px;border-left:2px solid var(--line)}
.alw select{width:170px}
.big2{font-size:15px;font-weight:700;padding:10px 14px;min-height:44px;border-radius:10px;border:0;cursor:pointer;background:#2b5f9e;color:#fff}
.big2.on{background:var(--neg)}
.big2.stopclk{background:var(--neg);color:#fff;min-width:220px}
.big2.restart{background:var(--pos,#1f8a4c);color:#fff;min-width:220px}
.arsn{display:flex;flex-wrap:wrap;align-items:center;gap:6px;flex-basis:100%;margin-top:6px}
.arsn.ask{padding:8px 10px;border-radius:12px;background:var(--warnbg,#fff4d6);border:1px solid var(--warn,#c98a00)}
.arsn small{font-weight:700;margin-right:4px}
.bigclk{font-size:28px;font-weight:800;min-height:124px;min-width:270px;padding:10px 22px;border-radius:16px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#fff;background:var(--neg);box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation}
.bigclk.restart{background:var(--pos,#1f8a4c)}
.stat.astop{position:relative} .stat.astop>b{color:var(--neg)} .stat.astop>small::after{content:'CLOCK STOPPED';display:block;width:max-content;margin-top:2px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#fff;background:var(--neg);border-radius:6px;padding:1px 6px}
.bigclk small{font-size:13px;font-weight:700;opacity:.92;text-transform:none;letter-spacing:0;color:#fff}
.bigclk b{font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff}
.bigclk:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.rsnbox{max-width:520px!important} .rsnbox .note{margin:-4px 0 12px;font-size:15px}
.rsngrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rsngrid button{min-height:68px;font-size:19px;font-weight:700;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.trimrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0 0}

.trimlist button.sel{border-color:var(--pos,#1f8a4c);box-shadow:inset 0 0 0 2px var(--pos,#1f8a4c)}
.trimlist b{font-size:22px;font-variant-numeric:tabular-nums}
.rchip .tdur{border:0;background:none;font:inherit;font-weight:800;color:inherit;cursor:pointer;text-decoration:underline dotted;padding:0 2px}
.rsngrid button.sel{border-color:var(--pos,#1f8a4c);box-shadow:inset 0 0 0 2px var(--pos,#1f8a4c)}
#tabs button{border:0;background:none;padding:12px 14px;cursor:pointer;color:var(--mute);border-bottom:3px solid transparent;white-space:nowrap;font-weight:600}
#tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
main{max-width:1500px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
input,select,textarea{background:var(--input);border:1px solid var(--line);border-radius:7px;padding:7px 8px;min-height:36px;width:100%;font-size:14px;text-transform:none;letter-spacing:0}

.x:hover{color:var(--neg)}
/* live */
.live{display:flex;flex-direction:column;gap:8px;border-radius:12px;padding:10px 12px;background:var(--acc-soft);border:1px solid var(--line)}

.mini{display:flex;gap:4px;align-items:center;margin-right:6px}

.mb{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--card);font-size:11px;font-weight:700;color:var(--mute)}
.mb.w{background:var(--neg);color:#fff;border-color:var(--neg)} .mb.e{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}

.s1box{max-width:520px;margin-bottom:10px}
.ballpanel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.bp-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.ovstrip{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ovc{display:inline-flex;flex-direction:column;gap:1px;min-width:92px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:5px 8px;font-size:12px;line-height:1.2;white-space:nowrap;border-left-width:5px}
.ovc b{font-size:14px} .ovc .bn{color:var(--mute)} .ovc .bl{letter-spacing:.06em}

.fbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-radius:9px;padding:6px 12px;font-weight:700;font-size:14px;border:1px solid var(--line);background:var(--card)}

.bb2.appeal{border-color:var(--acc);background:var(--acc-soft)}

function offLines(items){

  it.forEach(a=>{ const r=rows[rows.length-1]; if(r&&Math.abs(r.cy-a.cy)<Math.max(r.h,a.h)*0.6){ r.l.push(a); r.cy=(r.cy*(r.l.length-1)+a.cy)/r.l.length; } else rows.push({cy:a.cy,h:a.h,l:[a]}); });

function offParse(lines){

  lines.forEach((ln,k)=>{ const m=ln.match(/target[^0-9]*(\d{1,3})(?![\d.])/i); if(m&&!target) target=m[1];
    const t=ln.trim().split(/[\s|]+/); if(t.length<6||!t.every(v=>/^(\d{1,3}(\.[0-5])?|[-–])$/.test(v))) return;

function offCheck(target,text){

  if(tg==null||!Number.isInteger(tg)||tg<1||tg>500) bad.push('Enter the target from the sheet');
  String(text||'').split('\n').forEach((ln,n)=>{ if(!ln.trim()) return; const t=ln.trim().split(/[\s|,]+/);
    if(t.length!==11){ bad.push(`Table line ${n+1}: needs the over and 10 figures (0–9 wickets) – found ${t.length-1}`); return; }
    if(!OB_RE.test(t[0])){ bad.push(`Table line ${n+1}: “${t[0]}” isn’t an over`); return; }
    const v=t.slice(1).map(x=>/^[-–]$/.test(x)?null:(/^\d{1,3}$/.test(x)?+x:NaN));

    for(let w=0;w<10;w++){ const x=r.v[w]; if(x==null) continue;

      </div></section>`; }).join('')+`<p class="note">Appendix G: the team batting second in the match bats first in the Super Over (${gc(9)}). Each side faces one over, or until 2 wickets fall. One unsuccessful player review per team per innings in each Super Over (${gc(10)}). Subsequent Super Overs start 5 minutes after the one before (${gc('13.2.1')}). Finals: 30 minutes extra time in total, from the start of the first Super Over (${gc(2)}).</p>`+foot;

/* Reduced overs – WBBL logic ported from BoundaryLine Rain & Overs v7.4 (WBBL12 2026-27: cl. 11.3.3, 12.6, 13.7.2, Appendix J.1).
   Times are worked in whole minutes as the app does (TU.minBetween rounds to the nearest minute). */
const fmtHM=s=>{ if(s==null) return '–'; s=((Math.round(s)%86400)+86400)%86400; const h=Math.floor(s/3600), m=Math.floor(s%3600/60); return (h%12||12)+':'+p2(m)+(h<12?'am':'pm'); };
function revMode(){ const R=M.rev; if(R.mode) return R.mode; const p0=innPos(0), p1=innPos(1); return (p1.started||p0.complete)?2:1; }
const dur=r=>{ let d=r.to-r.from; if(d<0) d+=86400; return d; };
const rTo=r=>r.plan!=null?r.plan:r.to;   // umpires' restart time wins over the actual stamp for the overs calculation
function revRowsDone(k){ return (M.rev[k]||[]).filter(r=>r.from!=null&&rTo(r)!=null).map(r=>Object.assign({},r,{to:rTo(r)})).sort((a,b)=>a.from-b.from); }
function revRows(k){ return revRowsDone(k).reduce((s,r)=>s+dur(r),0); }
function revSched(){ const R=M.rev; if(R.sched!=null) return R.sched; if(M.time){ const [h,m]=M.time.split(':').map(Number); return h*3600+m*60; } return null; }
const WB=new Proxy({},{get:(t,k)=>{ const w=CP().wb; if(isBBL()){ const r=(S&&S.settings&&S.settings.bbl)||{}; if(k==='intThr'&&r.intRule==='gt21') return 22; if(k==='window'&&r.cut5==='extra') return w.window+8; } return w[k]; }});
const bblRuleNote=()=>{ const r=S.settings.bbl||{}; return ` <b>BBL rulings in use:</b> interval cut to 10 min when ${r.intRule==='gt21'?'more than 21':'21 or more'} minutes are lost; latest 5-over start is the scheduled finish minus ${r.cut5==='extra'?'42 (one extra over per team allowed)':'50'} minutes. Change these in Settings.`; };   // reduced-overs values for this match's competition
const minB=(a,b)=>{ let d=b-a; if(d<-43200) d+=86400; return Math.max(0,Math.round(d/60)); };   // TU.minBetween
const r2=v=>Math.round(v*100)/100, cMin=v=>Math.ceil(v-1e-9);
// EqualOversCalculator.plan – keep adding overs until the match doesn't finish before the original/rescheduled cessation
function eqPlan(target,restart,played,initial,interval){
  let overs=Math.min(WB.max,Math.max(0,initial)), len=0, e1=restart, s2=restart, e2=restart; const first=overs;
  while(true){ len=cMin(overs*WB.mpo); e1=restart+Math.max(0,len-played)*60; s2=e1+interval*60; e2=s2+len*60; if(target==null||e2>=target||overs===WB.max) break; overs++; }
  return {overs,len,e1,s2,e2,extra:overs-first,target,meets:target==null||e2>=target};
}
function revCalc(){
  const R=M.rev, mode=revMode(), sched=revSched(), orig=sched!=null?sched+(WB.net+WB.int)*60:null, target=R.cess!=null?R.cess:orig;

  return {mode,Hs,Em,Fm,Gm,lost,J,K,C,L,restart,v:J,exceeds,used,latest5,sched,orig,target,late,rows,durs,al};
}

function summaryText(){
  const L=[`${CP().name} over-rate summary: ${M.teamA||'Team A'} v ${M.teamB||'Team B'}, ${M.date}${M.venue?', '+M.venue:''} (${M.matchOvers} overs)`]; if(M.umps) L.push(umpLine(M));
  sumData().forEach(d=>{ const {inn,c,k}=d;
    L.push('',`INNINGS ${d.i+1} – bowling: ${inn.bowling||'—'}`,`Start ${T(c.s1)} | allowances ${fmtD(c.tot)} | finish time ${k?T(k.finish):'–'} | last over finished ${k?T(k.actual):'–'} | ${d.result} | wickets ${c.wk}`);
    inn.allow.forEach((a,r)=>{ if(a.reason||a.start!=null||a.min!=null) L.push(`  Allowance: ${a.reason||'?'}${a.src?' ('+a.src+')':''} ${T(a.start)}–${T(a.stop)} = ${(c.aRows[r]/60).toFixed(2)} min`); });
    if(c.wkA) L.push(`  Wickets in last 3 overs: ${c.wkL3} counted = ${(c.wkA/60).toFixed(2)} min`);
    if(c.rdA) L.push('  Reduced overs: 1 over allowance = '+fmtD(c.rdA));
    (M.subs||[]).filter(s=>s.inn===d.i).forEach(s=>L.push(`  Substitution (${s.team}): ${s.on} for ${s.off} – ${SUBK[s.kind]}, over ${s.over}, ${T(s.time)}`));
    (inn.capTold||[]).forEach(t=>L.push(`  Captains told: end of over ${t.over}, ${t.status}, ${T(t.time)}`));
    (inn.revs||[]).forEach(r=>L.push(`  Player review: over ${r.over}, ${r.team} – ${RV_OUT[r.out]}`));
    inn.leaving.forEach(l=>{ if(l.name||l.off!=null) L.push(`  Off field: ${l.name||'?'} ${T(l.off)}–${T(l.on)}${l.reason?' ('+l.reason+')':''}`); });
    (inn.appeals||[]).forEach(a=>L.push('  Appeal: '+apText(a)));
    L.push('  Over | bowler | start | finish | allowances this over | ± incl. allowances to that over');
    inn.overs.slice(0,d.N).forEach((o,k2)=>{ if(o.start!=null||o.finish!=null) L.push(`  ${k2+1} | ${o.bowler||'—'} | ${T(o.start)} | ${T(o.finish)} | ${fmtD(c.rows[k2].alw)} | ${c.rows[k2].pi==null?'':fmtSigned(c.rows[k2].pi)}${c.sc[k2].any?' | '+c.sc[k2].r+' runs, '+(c.sc[k2].cum+(+inn.adj||0))+'/'+c.sc[k2].cw:''}${o.capt==='Yes'?' | captain told':''}`); });
  });
  if(M.dlsOff) L.push(offText());
  soList().forEach(t=>L.push(t));
  return L.join('\n');
}

/* ---------- match events, in over order ---------- */
function overEvents(i,c){ const inn=M.inn[i], ev=c.rows.map(()=>[]), add=(n,t)=>{ n=Math.min(c.N,Math.max(1,+n||1)); ev[n-1].push(t); };

function startAllow(inn,reason,src,auto){ const v=nowSec(); if(inn.allow.some(a=>a.start!=null&&a.stop==null)) return null; let e=inn.allow.find(a=>a.start==null&&a.stop==null&&a.min==null&&!a.reason); if(!e){ e=blankAllow(); inn.allow.push(e); } e.start=v; e.reason=reason; if(src) e.src=src; if(auto) e.auto=auto; return e; }
function addDrinks(i){ const inn=M.inn[i]; if(IN(i)<=15||inn.allow.some(a=>a.auto==='drinks')) return false;
  let e=inn.allow.find(a=>a.start==null&&a.stop==null&&a.min==null&&!a.reason); if(!e){ e=blankAllow(); inn.allow.push(e); }

/* ---------- events ---------- */
function ask(title,cb,ph){ UI.askCb=cb; const m=$('#modal');
  m.innerHTML=`<div class="box askbox"><h2>${esc(title)}</h2><input id="askin" autocomplete="off" autocapitalize="characters" placeholder="${esc(ph||'')}"><p class="askbtns"><button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn" data-act="ask-ok">Add</button></p></div>`;
  m.hidden=false; setTimeout(()=>{ const i=$('#askin'); if(i) i.focus(); },50); }
const aDur=a=>a.min!=null?Math.round(a.min*60):(a.start!=null&&a.stop!=null?Math.max(0,a.stop-a.start):0);
const TRIM=[5,10,15,30,60];
const trimBtns=(i,k)=>`<div class="trimrow"><small>Too much?</small>${TRIM.map(t=>`<button type="button" data-act="trim" data-a="${i}" data-b="${k}:${t}">−${t<60?t+'s':'1 min'}</button>`).join('')}<button type="button" class="add" data-act="trim" data-a="${i}" data-b="${k}:-5" title="Put 5 seconds back">+5s</button></div>`;
function trimModal(){ const u=UI.trim, m=$('#modal'); if(!u){ m.hidden=true; return; } const inn=M.inn[u.i];
  const list=inn.allow.map((a,k)=>({a,k})).filter(x=>!(x.a.start!=null&&x.a.stop==null)&&aDur(x.a)+(x.a.reason?1:0)+(x.a.start!=null?1:0)>0).slice(-5).reverse();
  if(!list.length){ m.hidden=true; UI.trim=null; toast('No time allowances in this innings yet'); return; }
  if(u.k==null||!list.some(x=>x.k===u.k)) u.k=list[0].k; const tot=inn.allow.reduce((s,a)=>s+aDur(a),0);
  m.innerHTML=`<div class="box askbox rsnbox"><h2>Take time off a stoppage</h2><p class="note">Innings ${u.i+1} · total allowances <b>${fmtD(tot)}</b>. Pick the stoppage, then tap to take time off.</p><div class="trimlist">${list.map(x=>`<button type="button" class="${x.k===u.k?'sel':''}" data-act="trim-pick" data-b="${x.k}"><span>${esc(x.a.reason?arLbl(x.a.reason):'No reason')}${x.a.start!=null?' · '+fmtHMS(x.a.start):''}</span><b>${fmtD(aDur(x.a))}</b></button>`).join('')}</div>${trimBtns(u.i,u.k)}<p class="askbtns"><button class="btn" data-act="trim-done">Done</button></p></div>`;
  m.hidden=false; }
function reasonModal(){ const u=UI.arsn, m=$('#modal'), e=u&&M.inn[u.i]&&M.inn[u.i].allow[u.k]; if(!e||e.stop==null){ m.hidden=true; return; }
  m.innerHTML=`<div class="box askbox rsnbox"><h2>Why did the clock stop?</h2><p class="note">Stopped <b>${fmtD(e.stop-e.start)}</b> · ${fmtHMS(e.start)} to ${fmtHMS(e.stop)}</p><div class="rsngrid">${AR_PRE.map(([l,r])=>`<button type="button" class="${e.reason===r?'sel':''}" data-act="rsn-pick" data-b="${r}">${l}</button>`).join('')}</div>${trimBtns(u.i,u.k)}<p class="askbtns"><button class="btn ghost" data-act="rsn-skip">${e.reason?'Keep '+esc(arLbl(e.reason)):'Skip for now'}</button></p></div>`;
  m.hidden=false; }
function confirmBox(msg,okLabel,cb){ UI.askCb=cb; const m=$('#modal');
  m.innerHTML=`<div class="box askbox"><h2>${esc(msg)}</h2><p class="askbtns"><button class="btn ghost" data-act="close-modal">Cancel</button><button class="btn${/Delete|Clear|Replace/.test(okLabel)?' danger':''}" data-act="ask-ok">${esc(okLabel)}</button></p></div>`;
  m.hidden=false; }
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&e.target.id==='askin'){ e.preventDefault(); act('ask-ok'); } });
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.remove('hasbtn'); t.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('on','hasbtn'),2200); }

function onOff(e){ const el=e.target, k=el&&el.dataset&&el.dataset.off; if(!k||!UI.off) return;
  if(k==='ok'){ UI.off.ok=el.checked; return; }
  if(UI.off[k]===el.value) return; UI.off[k]=el.value; UI.off.ok=false;   // any edit means check it again
  const t=document.querySelector('[data-off="ok"]'); if(t) t.checked=false;
  const out=document.querySelector('[data-b="offchk"]'); if(out) out.innerHTML=offChkHTML(offCheck(UI.off.target,UI.off.text)); }
document.addEventListener('input',onOff); document.addEventListener('change',onOff);
function onField(el){
  const p=el.dataset.p, k=el.dataset.k; let v;
  if(M.locked&&/^m\./.test(p)){ toast('Match finalised – unlock it on the Summary tab to make changes'); render(); return; }
  if(k==='ump'){ if(/^m\.umps\./.test(p)){ M.umps=M.umps||['','']; for(let q=0;q<2;q++) if(M.umps[q]==null) M.umps[q]=''; if(M.third==null) M.third=THIRD; } setPath(p,el.value.trim()); syncAp(); save(); updateComputed(); return; }
  const bm=p.match(/^m\.inn\.(\d)\.overs\.(\d+)\.bowler$/);
  if(bm){
    const inn=M.inn[+bm[1]], n=+bm[2], nm=norm(el.value);
    if(nm){
      const max=Math.ceil(IN(+bm[1])/5);
      const used=inn.overs.slice(0,IN(+bm[1])).filter((o,j)=>j!==n&&norm(o.bowler)===nm).length;
      let msg='';
      if((n>0&&norm(inn.overs[n-1].bowler)===nm)||(n+1<IN(+bm[1])&&norm(inn.overs[n+1].bowler)===nm)) msg=el.value.trim()+' can’t bowl consecutive overs';
      else if(used>=max) msg=el.value.trim()+' has already bowled the maximum '+max+' overs';
      if(msg){ el.value=''; inn.overs[n].bowler=''; save(); updateComputed(); toast(msg); return; }
    }
  }
  switch(k){
    case 'bblfx': { const f=BFIX.find(x=>x.id===el.value); if(f){ applyFixture(M,f); M.inn[0].bowling=''; M.inn[1].bowling=''; save(); applyTheme(); render(); toast('BBL|16 '+(typeof f.no==='number'?'Match '+f.no:f.no)+' loaded'); } return; }
    case 'venue': if(el.value==='__other'){ el.value=M.venue||''; ask('Ground name',nm=>{ M.venue=nm; S.settings.lastVenue=nm; save(); render(); }); return; } else v=el.value; break;
    case 'time': v=parseT(el.value); if(v===undefined){ el.classList.add('bad'); return; } el.classList.remove('bad');
      { const rm=p.match(/^m\.rev\.(s[12])\.(\d+)\.(plan|to)$/); const rr=rm&&M.rev[rm[1]]&&M.rev[rm[1]][+rm[2]];
        if(rr&&v!=null&&rr.from!=null&&v<rr.from&&v+43200>=rr.from&&v<43200) v+=43200;
        const fm=p.match(/^m\.rev\.(s[12])\.(\d+)\.from$/), fr=fm&&M.rev[fm[1]]&&M.rev[fm[1]][+fm[2]]; if(fr) delete fr.raw; }
      break;
    case 'dur': v=parseD(el.value); if(v===undefined){ el.classList.add('bad'); return; } el.classList.remove('bad'); break;
    case 'num': v=el.value===''?null:Number(el.value); break;
    case 'int': v=parseInt(el.value,10); break;
    case 'chk': v=el.checked; break;
    case 'skin': v=el.value; break;
    case 'plist': v=el.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean); break;
    default: v=el.value;
  }
  if(k==='dur'&&v==null&&/perOver|brk|fullFinish|redExtra/.test(p)) v=p.startsWith('s.bbl.')?BBL_DEF[p.slice(6)]:p.startsWith('s.')?defaultSettings()[p.slice(2)]:(/brk$/.test(p)?CS().brk:CS().perOver);
  { const mn=p.match(/^m\.inn\.(\d)\.allow\.(\d+)\.min$/); if(mn){ const a=M.inn[+mn[1]].allow[+mn[2]]; if(a&&a.start==null&&a.at==null&&v!=null) a.at=nowSec(); } }
  setPath(p,v); if(p==='s.skin'||p==='s.teamCol') applyTheme();
  const am=p.match(/^m\.inn\.(\d)\.arReason$/);
  if(am){ const r=M.inn[+am[1]].allow.find(a=>a.start!=null&&a.stop==null); if(r){ r.reason=v; save(); render(); return; } }
  let rerender=false;
  if(p==='m.matchOvers'){ M.inn.forEach(inn=>{ inn.N=null; inn.rRed = v<20; inn.rDrinks = v>15; }); rerender=true; }
  else if(p==='m.inn.0.bowling'){ if(v && M.teamA && M.teamB && !M.inn[1].bowling) M.inn[1].bowling=otherTeam(v); rerender=true; }
  else if(/^m\.(teamA|teamB)$|^m\.inn\.\d\.bowling$|^m\.so\.\d\.team$|^m\.(date|venue)$/.test(p)) rerender=true;
  else if(/^m\.inn\.\d\.fp$/.test(p)) rerender=false;
  if(p==='m.venue') S.settings.lastVenue=v||'';
  if(p==='m.comp'){ const cs=csFor(v); S.settings.lastComp=v; M.inn.forEach(inn=>{ if(inn.overs[0].start==null) inn.perOver=cs.perOver; }); if(M.inn[1].overs[0].start==null) M.brk=cs.brk; PCD=null; if(UI.pc) UI.pc.page=null; save(); applyTheme(); render(); toast(COMPS[compKey()].label+' rules loaded'); return; }
  if(p==='m.brk'||p==='s.brk') { $$('[data-p="m.brk"]').forEach(e=>{ if(e!==el) e.value=fmtD(M.brk); }); }
  if(/^s\.(big|lefty|runs)$/.test(p)) rerender=true;
  if(p==='s.sound'&&v) beep(1,880,.12);
  save();
  if((rerender&&(el.tagName==='SELECT'||k==='int'||k==='chk'))||/^m\.rev\./.test(p)||/^m\.(dl\.n[12]|dlsS1)$/.test(p)) render(); else updateComputed();
  if(/^m\.(teamA|teamB|date|venue)$/.test(p)) $('#mname').textContent=CP().label+' · '+(M.teamA||'Team A')+' v '+(M.teamB||'Team B')+' · '+M.date+(M.venue?' · '+M.venue:'');
}
document.addEventListener('change',e=>{ const el=e.target.closest('[data-p]'); if(el) onField(el); else if(e.target.id==='impfile') importFile(e.target.files[0]); });
document.addEventListener('input',e=>{ const el=e.target.closest('[data-p]'); if(el&&/\.bowler$/.test(el.dataset.p)) return; if(el&&el.dataset.k==='text'&&el.tagName==='INPUT'&&el.type!=='date'&&!/^m\.(date|venue)$/.test(el.dataset.p)) onField(el); });

function stamp(path){
  snap(); const v=nowSec(); setPath(path,v);
  const mm=path.match(/^m\.inn\.(\d)\.overs\.(\d+)\.finish$/); if(mm) autoDrinks(+mm[1],+mm[2]+1,false);
  if(mm && S.settings.chain){ const i=+mm[1], k=+mm[2]+1; if(k<IN(i) && M.inn[i].overs[k].start==null){ M.inn[i].overs[k].start=v; autoBowler(i,k); } }
  { const ms=path.match(/^m\.inn\.(\d)\.overs\.(\d+)\.start$/); if(ms) autoBowler(+ms[1],+ms[2]); }
  save(); if(/^m\.rev\./.test(path)) render(); else updateComputed(); toast('Stamped '+fmtHMS(v));
}

const picker=$('#picker'); let pickFor=null;
function openPicker(btn){
  pickFor=btn; const set=btn.dataset.set==='s'?SO_OPTS:BALL_OPTS; const cur=getPath(btn.dataset.ball)||'';
  picker.innerHTML=set.map(o=>`<button type="button" data-v="${o}" class="${o===cur?'sel':''}">${o}</button>`).join('')+'<button type="button" class="clr" data-v="">Clear</button>';
  picker.hidden=false;
  const r=btn.getBoundingClientRect(), pw=picker.offsetWidth, ph=picker.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-pw/2),window.innerWidth-pw-8), y=r.bottom+6;
  if(y+ph>window.innerHeight-8) y=Math.max(8,r.top-ph-6);
  picker.style.left=x+'px'; picker.style.top=y+'px';
}
picker.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b||!pickFor) return; const bp=pickFor.dataset.ball, isB=pickFor.dataset.set==='b'; setPath(bp,b.dataset.v); picker.hidden=true; pickFor=null; save(); updateComputed();
  if(isB&&b.dataset.v){ const m=bp.match(/^(.*\.balls)\.(\d+)$/); const arr=getPath(m[1]); const fe=arr.indexOf(''); const need=6+arr.filter(x=>isX(x)).length;
    if(fe!==-1&&fe<need&&fe<9){ const nb=$('[data-ball="'+m[1]+'.'+fe+'"]'); if(nb) openPicker(nb); } } });

document.addEventListener('click',e=>{
  const t=e.target;
  if(!picker.hidden && !e.composedPath().includes(picker) && !t.closest('.ball')) picker.hidden=true;
  let el;
  if((el=t.closest('details.hdrd>summary'))){ const d=el.parentElement; UI.hdr[d.dataset.i]=!d.open; }
  if(M.locked&&(t.closest('[data-ball]')||(t.closest('[data-now]')&&/^m\./.test(t.closest('[data-now]').dataset.now)))){ toast('Match finalised – unlock it on the Summary tab to make changes'); return; }
  if((el=t.closest('[data-ball]'))){ openPicker(el); return; }
  if((el=t.closest('[data-now]'))){ stamp(el.dataset.now); offerUndo(); return; }
  if((el=t.closest('[data-tab]'))){ tab=el.dataset.tab; S.tab=tab; save(); render(); window.scrollTo(0,0); return; }
  if((el=t.closest('[data-act]'))){ act(el.dataset.act,el.dataset.a,el.dataset.b); return; }
});

function download(name,obj){ if(APP()){ appPost({type:'file',name,mime:'application/json',text:JSON.stringify(obj,null,1)}); return; } const blob=new Blob([JSON.stringify(obj,null,1)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); }
function importFile(f){
  if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const d=JSON.parse(r.result);
      if(d.kind==='match'){ const m=d.match; m.id=uid(); S.matches[m.id]=m; S.order.unshift(m.id); S.current=m.id; M=m; }
      else if(d.kind==='all'){ Object.assign(S.matches,d.state.matches); d.state.order.forEach(id=>{ if(!S.order.includes(id)) S.order.push(id); }); S.settings=Object.assign(S.settings,d.state.settings); }
      else throw 0;
      save(); render(); toast('Imported'); }catch(e){ toast('Not a valid backup file'); } };
  r.readAsText(f);
}
function matchLabel(m){ return (m.teamA||'Team A')+' v '+(m.teamB||'Team B'); }
function openMatches(){
  const m=$('#modal');
  m.innerHTML=`<div class="box"><div style="display:flex;align-items:center;gap:10px"><h2 style="margin:0;flex:1;font-size:18px">Matches</h2><button class="btn ghost sm" data-act="practice">🧪 Practice match</button><button class="btn sm" data-act="new-match">+ New match</button><button class="x" data-act="close-modal" aria-label="Close">×</button></div>
    ${fxUpcoming().map(f=>{ const id=fxMatch(f.id); return `<div class="mrow"><div class="nm"><b>${esc(f.a)} v ${esc(f.b)}</b><small>Fixture · ${fxDate(f)} ${fxTime(f.time)} · ${esc(f.venue)}</small></div><button class="btn sm" data-act="fixture" data-a="${f.id}">${id?'Open':'Start'}</button></div>`; }).join('')}
    ${S.order.map(id=>{ const x=S.matches[id]; return `<div class="mrow"><div class="nm"><b>${x.practice?'🧪 PRACTICE · ':''}${esc(matchLabel(x))}</b><small>${esc(x.date)}${x.venue?' · '+esc(x.venue):''}${id===S.current?' · open':''}</small></div>
      <button class="btn ghost sm" data-act="open-match" data-a="${id}">Open</button><button class="btn danger sm" data-act="del-match" data-a="${id}">Delete</button></div>`; }).join('')}</div>`;
  m.hidden=false;
}
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') e.target.hidden=true; });

function act(a,x,y){ const u0=UNDO.length, top=UNDO[UNDO.length-1]; actCore(a,x,y);
  if(a!=='undo'&&UNDO.length&&(UNDO.length!==u0||UNDO[UNDO.length-1]!==top)) offerUndo(); }
function actCore(a,x,y){
  if(M&&M.locked&&!LOCK_OK.has(a)){ toast('Match finalised – unlock it on the Summary tab to make changes'); return; }
  switch(a){
    case 'pen-open': penOpen(+x); break;
    case 'pen-pick': UI.pen2.cl=y; UI.pen2.step=2; delete UI.pen2.out; delete UI.pen2.xtra; delete UI.pen2.kind; delete UI.pen2.off; penModal(); break;
    case 'pen-back': UI.pen2={i:UI.pen2.i,step:1}; penModal(); break;
    case 'pen-off': UI.pen2.off=y; delete UI.pen2.kind; penModal(); break;
    case 'pen-kind': UI.pen2.kind=y; penModal(); break;
    case 'pen-x': UI.pen2.xtra=(UI.pen2.xtra===y)?null:y; penModal(); break;
    case 'pen-rec': penRecord(); break;
    case 'lo-x': UI.loX=UI.loX||{}; UI.loX[+x]=+y; updateComputed(); break;
    case 'tchk': timerCheck(+x); break;
    case 'tchk-x': UI.tchk=null; updateComputed(); break;
    case 'practice': confirmBox('Start a practice match? It’s kept out of backups and the CA report. Any earlier practice match is replaced.','Start practice',practiceMatch); break;
    case 'export-match': exportMatch(); break;
    case 'chk': { M.chk=M.chk||{}; M.chk[y]=!M.chk[y]; save(); render(); break; }
    case 'finalise': confirmBox('Finalise this match? Entries will be locked (you can unlock it later).','Finalise',()=>{ M.locked=true; M.lockedAt=nowSec(); save(); appSnap('match finalised'); render(); setTimeout(()=>confirmBox('Match finalised. Save a copy to Files as well? (The app’s own backups are lost if the app is deleted – a copy in Files isn’t.)','Save to Files',exportMatch),150); }); break;
    case 'unlock': confirmBox('Unlock this match so it can be edited?','Unlock',()=>{ M.locked=false; save(); render(); toast('Unlocked'); }); break;
    case 'ca-mail': caMail(); break;
    case 'bk-list': appPost({type:'listBackups'}); break;
    case 'bk-now': appSnap('manual backup'); toast('Backup saved'); setTimeout(()=>appPost({type:'listBackups'}),300); break;
    case 'bk-restore': confirmBox('Restore this backup? Everything is replaced by that copy (your current data is backed up first).','Restore',()=>appPost({type:'restore',id:x})); break;
    case 'print': if(APP()) appPost({type:'print'}); else window.print(); break;
    case 'ca-report': caReport(); break;
    case 'matches': openMatches(); break;
    case 'close-modal': $('#modal').hidden=true; UI.askCb=null; UI.arsn=null; UI.trim=null; UI.pen2=null; break;
    case 'ask-ok': { const cb=UI.askCb, i=$('#askin'); let v=true; if(i){ v=norm(i.value).replace(/\s+/g,' '); if(!v){ i.focus(); break; } } UI.askCb=null; $('#modal').hidden=true; if(cb) cb(v); break; }
    case 'new-match-c': confirmBox('Start a new match? The current one stays saved under Matches.','New match',()=>act('new-match')); break;
    case 'new-match': { appSnap('before new match'); UNDO.length=0; const m=newMatch(); S.matches[m.id]=m; S.order.unshift(m.id); S.current=m.id; M=m; tab='i0'; save(); $('#modal').hidden=true; render(); toast('New match'); break; }
    case 'open-match': S.current=x; UNDO.length=0; M=S.matches[x]; save(); $('#modal').hidden=true; render(); break;
    case 'del-match': confirmBox('Delete this match?','Delete',()=>{ appSnap('before deleting a match'); delete S.matches[x]; S.order=S.order.filter(i=>i!==x);
        if(!S.order.length){ const m=newMatch(); S.matches[m.id]=m; S.order=[m.id]; } if(S.current===x){ S.current=S.order[0]; M=S.matches[S.current]; } save(); render(); openMatches(); }); break;
    case 'allow-toggle': { snap(); const inn=M.inn[+x], v=nowSec(); const run=inn.allow.find(a=>a.start!=null&&a.stop==null);
        UI.awarn=null; if(run){ run.stop=v; if(!run.reason) run.reason=inn.arReason||''; if(run.auto!=='review') UI.arsn={i:+x,k:inn.allow.indexOf(run),pop:1}; toast('Clock restarted – '+fmtD(run.stop-run.start)+' allowance'+(run.reason?' ('+arLbl(run.reason)+')':'')); }
        else { let e=inn.allow.find(a=>a.start==null&&a.stop==null&&a.min==null&&!a.reason); if(!e){ e=blankAllow(); inn.allow.push(e); } e.start=v; e.reason=inn.arReason||''; toast('Allowance started'); }
        save(); render(); if(UI.arsn&&UI.arsn.pop) reasonModal(); break; }
    case 'rsn-pick': { const u=UI.arsn, e=u&&M.inn[u.i].allow[u.k]; UI.arsn=null; $('#modal').hidden=true; if(!e) break; snap(); e.reason=y; e.src=y==='TV'?'TV':'U'; save(); render(); toast('Reason: '+arLbl(y)+' · '+fmtD(e.stop-e.start)); break; }
    case 'trim-open': UI.trim={i:+x,k:y!=null&&y!==''?+y:null}; trimModal(); break;
    case 'trim-pick': if(UI.trim){ UI.trim.k=+y; trimModal(); } break;
    case 'trim-done': UI.trim=null; $('#modal').hidden=true; render(); break;
    case 'trim': { const [k,t]=String(y).split(':').map(Number), inn=M.inn[+x], e=inn&&inn.allow[k]; if(!e) break; snap(); const before=aDur(e);
        if(e.min!=null) e.min=Math.max(0,Math.round((e.min*60-t))/60);
        else if(e.start!=null){ const end=e.stop!=null?e.stop:nowSec(); e.start=Math.min(end,e.start+t); }
        save(); updateComputed(); const after=aDur(e); toast((after<before?'Took '+fmtD(before-after)+' off':after>before?'Added '+fmtD(after-before)+' back':'Already 0:00')+' – now '+fmtD(after));
        if(UI.arsn&&UI.arsn.pop&&!$('#modal').hidden&&!UI.trim) reasonModal(); else if(UI.trim) trimModal(); break; }
    case 'sum-more': UI.sumMore=!UI.sumMore; render(); break;
    case 'rsn-skip': UI.arsn=null; $('#modal').hidden=true; render(); break;
    case 'clear-match': confirmBox('Clear every input in this match and start again?','Clear match',()=>{ UNDO.length=0; const id=M.id, fresh=newMatch(); fresh.id=id; S.matches[id]=fresh; M=fresh; save(); render(); toast('Match cleared'); }); break;
    case 'xi-toggle': { snap(); const sel=M.xi[x]=M.xi[x]||[]; const k=sel.indexOf(y); if(k>=0) sel.splice(k,1); else if(sel.length<xiMax()) sel.push(y); else toast('Already '+xiMax()+' selected'); save(); render(); break; }
    case 'xi-clear': snap(); M.xi[x]=[]; save(); render(); break;

          if(pz.started){ if(d.n1==null) d.n1=dlsInput().n1; if(md===2&&d.n2==null) d.n2=dlsInput().n2;
            const inp=dlsInput(), ex=d[kk].find(r=>String(r.b)===String(pz.ob))||d[kk].find(r=>r.d===''||r.d==null);
            const exD=ex&&ex.d!==''&&ex.d!=null?DLS.odbTodec(+ex.d):0, lost=(md===2?inp.left2:inp.left1)+exD-v;   // re-applying replaces, never stacks
            if(ex){ ex.b=pz.ob; ex.w=String(pz.wk); ex.d=lost>1e-9?DLS.decToodb(lost):''; } else if(lost>1e-9) d[kk].push({b:pz.ob,w:String(pz.wk),d:DLS.decToodb(lost)}); }
          else { const pl=revDlsPlan(v); if(pl){ if(d.n1==null&&pl.kind!=='n1') d.n1=dlsInput().n1; if(pl.kind==='n2') d.n2=pl.n; else if(pl.kind==='n1') d.n1=pl.n; } }
          (M.rev[kk]||[]).forEach(r=>{ if(r.from!=null&&r.to==null) r.applied=v; }); }
        M.inn.forEach(z=>z.gwlPrompt=null); if(revMode()===2){ M.inn[1].N=v; M.inn[1].rRed=v<20; } else { M.matchOvers=v; M.inn.forEach(inn=>{ inn.rRed=v<20; inn.N=null; }); } save(); tab=revMode()===2?'i1':'i0'; S.tab=tab; render(); toast((revMode()===2?'2nd innings':'Match')+' set to '+v+' overs'); } break; }
    case 'share-summary': { const txt=summaryText(); if(APP()){ appPost({type:'text',text:txt}); break; } if(navigator.share){ navigator.share({title:CP().name+' over-rate summary',text:txt}).catch(()=>{}); } else if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('Summary copied')).catch(()=>toast('Could not copy')); } break; }
    case 'email-summary': location.href='mailto:?subject='+encodeURIComponent(CP().name+' over-rate summary – '+matchLabel(M)+' '+M.date)+'&body='+encodeURIComponent(summaryText()); break;
    case 'share-backup': { const name='running-sheet-'+matchLabel(M).replace(/\W+/g,'_')+'-'+M.date+'.json', json=JSON.stringify({kind:'match',match:M},null,1); if(APP()){ appPost({type:'file',name,mime:'application/json',text:json}); break; }
        try{ const f=new File([json],name,{type:'application/json'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'Running sheet backup'}).catch(()=>{}); break; } }catch(e){}
        download(name,{kind:'match',match:M}); break; }
    case 'reset-venues': S.settings.venues=clone(DATA.venues); save(); render(); break;
    case 'all-allow': UI.allA=UI.allA||{}; UI.allA[+x]=!UI.allA[+x]; render(); break;
    case 'add-allow': UI.allA=UI.allA||{}; UI.allA[+x]=true; M.inn[+x].allow.push(blankAllow()); save(); render(); break;
    case 'del-allow': { snap(); const a=M.inn[+x].allow[+y]; M.inn[+x].allow.splice(+y,1); save(); render(); toast((a&&a.reason?a.reason:'Stoppage')+' deleted – tap ↶ Undo (⋯ menu) if that was a mistake'); break; }
    case 'add-leave': M.inn[+x].leaving.push(blankLeave()); save(); render(); break;
    case 'del-leave': M.inn[+x].leaving.splice(+y,1); save(); render(); break;
    case 'add-batter': if(M.so[+x].batters.length<11){ M.so[+x].batters.push({name:'',balls:Array(10).fill('')}); save(); render(); } break;
    case 'del-batter': M.so[+x].batters.splice(+y,1); save(); render(); break;
    case 'dl-add': { snap(); const d=M.dl||(M.dl=blankDL()); if(d[x].length<10){ d[x].push({b:'',w:'',d:''}); save(); render(); } break; }
    case 'dl-del': { snap(); M.dl[x].splice(+y,1); save(); render(); break; }
    case 'reset-squads': confirmBox('Replace all squad lists with the original ones?','Replace',()=>{ S.settings.players=clone(DATA.players); save(); render(); }); break;
    case 'theme': { const r=document.documentElement; const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches; r.dataset.theme=dark?'light':'dark'; applyTheme(); break; }
  }
}

let wl=null;
async function keepAwake(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible' && !wl){ wl=await navigator.wakeLock.request('screen'); wl.addEventListener('release',()=>{ wl=null; }); } }catch(e){} }
document.addEventListener('click',keepAwake); document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') keepAwake(); });
init(); render();
window.__app={get S(){return S;},get M(){return M;},calcInn,render,updateComputed,parseT,parseD};
})();
</script>
