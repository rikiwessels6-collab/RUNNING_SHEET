# XcodeGen spec: turns the Swift Playgrounds project into an Xcode project
# so GitHub Actions can build it and upload it to TestFlight.
name: RunningSheet
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  RunningSheet:
    type: application
    platform: iOS
    sources:
      - path: "../Running Sheet.swiftpm"
        excludes:
          - "Package.swift"
          - ".swiftpm"
          - "**/.DS_Store"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Running Sheet
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.sports
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.boundarylineapps.overratesheet
        PRODUCT_NAME: Running Sheet
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
    scheme: {}
